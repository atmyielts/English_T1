name: Configure Academy Domain

on:
  workflow_dispatch:

jobs:
  configure-click-dns:
    if: github.ref_name == 'codex/configure-click-dns'
    runs-on: ubuntu-latest
    steps:
      - name: Validate Cloudflare token
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "Missing required secret: CLOUDFLARE_API_TOKEN"
            exit 1
          fi

      - name: Upsert DNS-only Click A record
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ZONE_ID: ce7920583a44835203a0a1afc9a96c87
          RECORD_NAME: click.schood.online
          RECORD_IP: 89.168.67.25
        run: |
          node <<'NODE'
          const headers = {
            Authorization: "Bearer " + process.env.CLOUDFLARE_API_TOKEN,
            "Content-Type": "application/json",
          };

          const api = async (method, path, body) => {
            const response = await fetch("https://api.cloudflare.com/client/v4" + path, {
              method,
              headers,
              body: body ? JSON.stringify(body) : undefined,
            });
            const raw = await response.text();
            let payload;
            try {
              payload = JSON.parse(raw);
            } catch {
              throw new Error(method + " " + path + " returned a non-JSON response");
            }
            if (!response.ok || !payload.success) {
              throw new Error(method + " " + path + " failed: " + JSON.stringify(payload.errors || payload));
            }
            return payload.result;
          };

          const zoneId = process.env.ZONE_ID;
          const name = process.env.RECORD_NAME;
          const content = process.env.RECORD_IP;
          const records = await api(
            "GET",
            "/zones/" + zoneId + "/dns_records?name=" + encodeURIComponent(name),
          );

          if (!Array.isArray(records)) {
            throw new Error("Cloudflare DNS lookup returned an unexpected result");
          }
          if (records.length > 1) {
            throw new Error("Refusing to modify multiple existing DNS records for " + name);
          }

          const desired = {
            type: "A",
            name,
            content,
            ttl: 1,
            proxied: false,
          };

          let record;
          if (records.length === 1) {
            record = await api("PUT", "/zones/" + zoneId + "/dns_records/" + records[0].id, desired);
            console.log("Updated DNS-only A record " + name + " -> " + content);
          } else {
            record = await api("POST", "/zones/" + zoneId + "/dns_records", desired);
            console.log("Created DNS-only A record " + name + " -> " + content);
          }

          if (
            record.type !== "A" ||
            record.name !== name ||
            record.content !== content ||
            record.proxied !== false ||
            record.ttl !== 1
          ) {
            throw new Error("Cloudflare returned a DNS record that does not match the requested configuration");
          }
          console.log("Verified Cloudflare record: type=A, proxied=false, ttl=Auto");
          NODE

  configure-domain:
    if: github.ref_name != 'codex/configure-click-dns'
    runs-on: ubuntu-latest
    steps:
      - name: Validate required secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=0
          for key in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            if [ -z "${!key}" ]; then
              echo "Missing required secret: $key"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Upsert Pages project, custom domain, and DNS
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ZONE_ID: ce7920583a44835203a0a1afc9a96c87
          PAGES_PROJECT: schood-academy
          CUSTOM_DOMAIN: academy.schood.online
          CNAME_TARGET: schood-academy.pages.dev
        run: |
          node <<'NODE'
          const headers = {
            Authorization: `Bearer ${process.env.CLOUDFLARE_API_TOKEN}`,
            "Content-Type": "application/json",
          };

          const api = async (method, path, body) => {
            const res = await fetch(`https://api.cloudflare.com/client/v4${path}`, {
              method,
              headers,
              body: body ? JSON.stringify(body) : undefined,
            });
            const raw = await res.text();
            let json;
            try {
              json = JSON.parse(raw);
            } catch {
              throw new Error(`${method} ${path} failed with non-JSON response: ${raw}`);
            }
            if (!res.ok || !json.success) {
              throw new Error(`${method} ${path} failed: ${JSON.stringify(json.errors ?? json, null, 2)}`);
            }
            return json.result;
          };

          const accountId = process.env.CLOUDFLARE_ACCOUNT_ID;
          const zoneId = process.env.ZONE_ID;
          const customDomain = process.env.CUSTOM_DOMAIN;
          const cnameTarget = process.env.CNAME_TARGET;
          const pagesProject = process.env.PAGES_PROJECT;

          try {
            await api("POST", `/accounts/${accountId}/pages/projects`, {
              name: pagesProject,
              production_branch: "main",
            });
            console.log(`Created Pages project ${pagesProject}`);
          } catch (error) {
            const msg = String(error?.message ?? "");
            if (msg.includes("already exists") || msg.includes("already added")) {
              console.log(`Pages project ${pagesProject} already exists`);
            } else {
              throw error;
            }
          }

          try {
            await api("POST", `/accounts/${accountId}/pages/projects/${pagesProject}/domains`, { name: customDomain });
            console.log(`Added Pages custom domain ${customDomain}`);
          } catch (error) {
            const msg = String(error?.message ?? "");
            if (msg.includes("already exists") || msg.includes("already added")) {
              console.log(`Pages custom domain ${customDomain} already exists`);
            } else {
              throw error;
            }
          }

          const existing = await api(
            "GET",
            `/zones/${zoneId}/dns_records?type=CNAME&name=${encodeURIComponent(customDomain)}`,
          );

          if (Array.isArray(existing) && existing.length > 0) {
            await api("PUT", `/zones/${zoneId}/dns_records/${existing[0].id}`, {
              type: "CNAME",
              name: customDomain,
              content: cnameTarget,
              ttl: 1,
              proxied: true,
            });
            console.log(`Updated CNAME ${customDomain} -> ${cnameTarget}`);
          } else {
            await api("POST", `/zones/${zoneId}/dns_records`, {
              type: "CNAME",
              name: customDomain,
              content: cnameTarget,
              ttl: 1,
              proxied: true,
            });
            console.log(`Created CNAME ${customDomain} -> ${cnameTarget}`);
          }

          const domains = await api("GET", `/accounts/${accountId}/pages/projects/${pagesProject}/domains`);
          const domain = Array.isArray(domains) ? domains.find((d) => d.name === customDomain) : null;
          console.log(`Pages domain status for ${customDomain}: ${domain?.status ?? "unknown"}`);
          NODE
