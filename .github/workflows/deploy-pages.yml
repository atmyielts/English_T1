name: Deploy Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: platform
            workspace: apps/platform
            dist: apps/platform/dist
            project: schood-platform
          - label: ielts
            workspace: apps/ielts-simulator
            dist: apps/ielts-simulator/dist
            project: schood-ielts
          - label: sat
            workspace: apps/sat-simulator
            dist: apps/sat-simulator/dist
            project: schood-sat
          - label: toefl
            workspace: apps/toefl-ibt-simulator
            dist: apps/toefl-ibt-simulator/dist
            project: schood-toefl
          - label: reading
            workspace: apps/english-reading
            dist: apps/english-reading/dist
            project: schood-reading

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_READING_PRODUCT_ID: ${{ secrets.VITE_READING_PRODUCT_ID }}
        run: |
          missing=0
          for key in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID VITE_SUPABASE_URL VITE_SUPABASE_ANON_KEY VITE_READING_PRODUCT_ID; do
            if [ -z "${!key}" ]; then
              echo "Missing required secret: $key"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build ${{ matrix.label }}
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_ALLOWED_RETURN_HOSTS: schood.online,ielts.schood.online,sat.schood.online,toefl.schood.online,reading.english.schood.online
          VITE_ADMIN_URL: https://schood.online/admin
          VITE_IELTS_URL: https://ielts.schood.online
          VITE_ACADEMY_URL: https://schood.online/academy
          VITE_PLATFORM_URL: https://schood.online
          VITE_AUTH_COOKIE_DOMAIN: .schood.online
          VITE_AUTH_SHARED_COOKIE: "true"
          VITE_READING_PRODUCT_ID: ${{ secrets.VITE_READING_PRODUCT_ID }}
          VITE_DISABLE_PAYWALL: "false"
          VITE_USE_MOCK_PERSISTENCE: "false"
          VITE_DEBUG_AUTH: "false"
        run: npm --workspace ${{ matrix.workspace }} run build

      - name: Deploy ${{ matrix.label }} to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy ${{ matrix.dist }} --project-name=${{ matrix.project }} --branch=main --commit-hash=${{ github.sha }}
