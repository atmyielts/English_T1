name: Deploy Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: platform
            workspace: apps/platform
            dist: apps/platform/dist
            project: schood-platform
          - label: ielts
            workspace: apps/ielts-simulator
            dist: apps/ielts-simulator/dist
            project: schood-ielts
          - label: ielts-practice
            workspace: apps/ielts-practice
            dist: apps/ielts-practice/dist
            project: schood-ielts-practice
          - label: ielts-playbook
            workspace: apps/ielts-playbook
            dist: apps/ielts-playbook/dist
            project: schood-ielts-playbook
          - label: sat
            workspace: apps/sat-simulator
            dist: apps/sat-simulator/dist
            project: schood-sat
          - label: sat-practice
            workspace: apps/sat-practice
            dist: apps/sat-practice/dist
            project: schood-sat-practice
          - label: sat-playbook
            workspace: apps/sat-playbook
            dist: apps/sat-playbook/dist
            project: schood-sat-playbook
          - label: toefl
            workspace: apps/toefl-ibt-simulator
            dist: apps/toefl-ibt-simulator/dist
            project: schood-toefl
          - label: toefl-playbook
            workspace: apps/toefl-playbook
            dist: apps/toefl-playbook/dist
            project: schood-toefl-playbook
          - label: itep
            workspace: apps/itep-simulator
            dist: apps/itep-simulator/dist
            project: schood-itep
          - label: reading
            workspace: apps/english-reading
            dist: apps/english-reading/dist
            project: schood-reading
          - label: writing
            workspace: apps/english-writing
            dist: apps/english-writing/dist
            project: schood-writing
          - label: listening
            workspace: apps/english-listening
            dist: apps/english-listening/dist
            project: schood-listening
          - label: speaking
            workspace: apps/english-speaking
            dist: apps/english-speaking/dist
            project: schood-speaking
          - label: grammar
            workspace: apps/english-grammar
            dist: apps/english-grammar/dist
            project: schood-grammar
          - label: vocabulary
            workspace: apps/english-vocabulary
            dist: apps/english-vocabulary/dist
            project: schood-vocabulary
          - label: immersion
            workspace: apps/english-immersion
            dist: apps/english-immersion/dist
            project: schood-immersion
          - label: english-hub
            workspace: apps/english-hub
            dist: apps/english-hub/dist
            project: schood-english

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_READING_PRODUCT_ID: ${{ secrets.VITE_READING_PRODUCT_ID }}
        run: |
          missing=0
          for key in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID VITE_SUPABASE_URL VITE_SUPABASE_ANON_KEY VITE_READING_PRODUCT_ID; do
            if [ -z "${!key}" ]; then
              echo "Missing required secret: $key"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build ${{ matrix.label }}
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_ALLOWED_RETURN_HOSTS: schood.online,english.schood.online,ielts.schood.online,practice.ielts.schood.online,playbook.ielts.schood.online,sat.schood.online,practice.sat.schood.online,toefl.schood.online,itep.schood.online,reading.english.schood.online,writing.english.schood.online,listening.english.schood.online,speaking.english.schood.online,grammar.english.schood.online,vocabulary.english.schood.online,immersion.english.schood.online
          VITE_ADMIN_URL: https://schood.online/admin
          VITE_IELTS_URL: https://ielts.schood.online
          VITE_ACADEMY_URL: https://schood.online/academy
          VITE_PLATFORM_URL: https://schood.online
          VITE_AUTH_COOKIE_DOMAIN: .schood.online
          VITE_AUTH_SHARED_COOKIE: "true"
          VITE_READING_PRODUCT_ID: ${{ secrets.VITE_READING_PRODUCT_ID }}
          VITE_DISABLE_PAYWALL: "false"
          VITE_USE_MOCK_PERSISTENCE: "false"
          VITE_DEBUG_AUTH: "false"
        run: npm --workspace ${{ matrix.workspace }} run build

      - name: Deploy ${{ matrix.label }} to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set +e
          attempt=1
          max_attempts=5
          delay=10
          while [ "$attempt" -le "$max_attempts" ]; do
            echo "Deploy attempt ${attempt}/${max_attempts} for ${{ matrix.project }}"
            output="$(npx --yes wrangler@4.71.0 pages deploy ${{ matrix.dist }} --project-name=${{ matrix.project }} --branch=main --commit-hash=${{ github.sha }} 2>&1)"
            status=$?
            echo "$output"
            if [ "$status" -eq 0 ]; then
              exit 0
            fi

            if echo "$output" | grep -Eiq "503 Service Unavailable|malformed response|upstream connect error|disconnect/reset before headers|connection termination"; then
              if [ "$attempt" -lt "$max_attempts" ]; then
                echo "Transient Cloudflare API failure detected. Retrying in ${delay}s..."
                sleep "$delay"
                attempt=$((attempt + 1))
                delay=$((delay * 2))
                continue
              fi
            fi
            exit "$status"
          done

          echo "Cloudflare deploy failed after ${max_attempts} attempts."
          exit 1

  configure-itep-domain:
    runs-on: ubuntu-latest
    needs: deploy
    if: ${{ always() }}

    steps:
      - name: Validate required secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=0
          for key in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            if [ -z "${!key}" ]; then
              echo "Missing required secret: $key"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Upsert iTEP Pages Domain and DNS CNAME
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ZONE_ID: ce7920583a44835203a0a1afc9a96c87
          CUSTOM_DOMAIN: itep.schood.online
          CNAME_TARGET: schood-itep.pages.dev
          PAGES_PROJECT: schood-itep
        run: |
          node <<'NODE'
          const headers = {
            Authorization: `Bearer ${process.env.CLOUDFLARE_API_TOKEN}`,
            "Content-Type": "application/json",
          };

          const api = async (method, path, body) => {
            const res = await fetch(`https://api.cloudflare.com/client/v4${path}`, {
              method,
              headers,
              body: body ? JSON.stringify(body) : undefined,
            });
            const raw = await res.text();
            let json;
            try {
              json = JSON.parse(raw);
            } catch {
              throw new Error(`${method} ${path} failed with non-JSON response: ${raw}`);
            }
            if (!res.ok || !json.success) {
              throw new Error(`${method} ${path} failed: ${JSON.stringify(json.errors ?? json, null, 2)}`);
            }
            return json.result;
          };

          const accountId = process.env.CLOUDFLARE_ACCOUNT_ID;
          const zoneId = process.env.ZONE_ID;
          const customDomain = process.env.CUSTOM_DOMAIN;
          const cnameTarget = process.env.CNAME_TARGET;
          const pagesProject = process.env.PAGES_PROJECT;

          try {
            await api("POST", `/accounts/${accountId}/pages/projects/${pagesProject}/domains`, { name: customDomain });
            console.log(`Added Pages custom domain ${customDomain}`);
          } catch (error) {
            const msg = String(error?.message ?? "");
            if (msg.includes("already exists") || msg.includes("already added")) {
              console.log(`Pages custom domain ${customDomain} already exists`);
            } else {
              throw error;
            }
          }

          const existing = await api(
            "GET",
            `/zones/${zoneId}/dns_records?type=CNAME&name=${encodeURIComponent(customDomain)}`,
          );

          if (Array.isArray(existing) && existing.length > 0) {
            await api("PUT", `/zones/${zoneId}/dns_records/${existing[0].id}`, {
              type: "CNAME",
              name: customDomain,
              content: cnameTarget,
              ttl: 1,
              proxied: true,
            });
            console.log(`Updated CNAME ${customDomain} -> ${cnameTarget}`);
          } else {
            await api("POST", `/zones/${zoneId}/dns_records`, {
              type: "CNAME",
              name: customDomain,
              content: cnameTarget,
              ttl: 1,
              proxied: true,
            });
            console.log(`Created CNAME ${customDomain} -> ${cnameTarget}`);
          }

          const domains = await api("GET", `/accounts/${accountId}/pages/projects/${pagesProject}/domains`);
          const domain = Array.isArray(domains) ? domains.find((d) => d.name === customDomain) : null;
          console.log(`Pages domain status: ${domain?.status ?? "unknown"}`);
          NODE
