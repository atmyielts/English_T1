name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Build steps below need the same Vite env that deploy-pages.yml provides.
    # Without these the platform / simulator / english-* apps' vite.config.ts
    # guards refuse to build and the validate job goes red on a clean checkout.
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      VITE_READING_PRODUCT_ID: ${{ secrets.VITE_READING_PRODUCT_ID }}
      VITE_ALLOWED_RETURN_HOSTS: schood.online,academy.schood.online,docs.academy.schood.online,english.schood.online,ielts.schood.online,practice.ielts.schood.online,playbook.ielts.schood.online,sat.schood.online,practice.sat.schood.online,playbook.sat.schood.online,toefl.schood.online,playbook.toefl.schood.online,itep.schood.online,reading.english.schood.online,writing.english.schood.online,listening.english.schood.online,speaking.english.schood.online,grammar.english.schood.online,vocabulary.english.schood.online,immersion.english.schood.online
      VITE_ADMIN_URL: https://schood.online/admin
      VITE_IELTS_URL: https://ielts.schood.online
      VITE_ACADEMY_URL: https://academy.schood.online
      VITE_PLATFORM_URL: https://schood.online
      VITE_AUTH_COOKIE_DOMAIN: .schood.online
      VITE_AUTH_SHARED_COOKIE: "true"
      VITE_DISABLE_PAYWALL: "false"
      VITE_USE_MOCK_PERSISTENCE: "false"
      VITE_DEBUG_AUTH: "false"
      VITE_RELEASE_SHA: ${{ github.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install dependencies
        run: npm ci

      - name: Production readiness checks
        run: npm run verify:prod

      - name: Release manifest drift check
        run: npm run verify:release -- --base origin/${{ github.base_ref || 'main' }}

      - name: Academy product readiness checks
        run: npm run verify:academy

      - name: Academy lint
        run: npm --workspace apps/academy run lint

      - name: Install Academy route browser
        run: npx playwright install --with-deps chromium

      - name: Academy mocked route smoke
        run: npm run test:academy:routes

      - name: Run unit tests
        run: npm test

      # This CI-only change can land before the independently reviewed feature.
      # Once the guide exists, its contracts are required and run without a skip override.
      - name: Adaptive onboarding contracts and Edge typecheck
        if: hashFiles('supabase/functions/guide/handler.test.ts') != ''
        run: npm run test:guide && npm run check:guide

      - name: Adaptive onboarding browser and accessibility contracts
        if: hashFiles('apps/platform/tests/guide.spec.ts') != ''
        run: npm run test:guide:browser

      - name: English Edge typecheck
        run: deno check supabase/functions/hub/index.ts

      - name: English mass-readiness contracts
        run: npm run --if-present test:english:mass-readiness

      - name: Academy Edge typecheck
        run: deno check supabase/functions/academy/index.ts

      - name: Academy Edge contract tests
        run: npm run test:academy:edge

      - name: Audit runtime dependencies
        # Fail closed on high/critical findings. The wrapper permits only the
        # owner-approved, RSC-only exception documented in the repository.
        run: node scripts/audit-runtime-dependencies.mjs

      - name: Build platform
        run: npm --workspace apps/platform run build

      - name: Build IELTS simulator
        run: npm --workspace apps/ielts-simulator run build

      - name: Build SAT simulator
        run: npm --workspace apps/sat-simulator run build

      - name: Build TOEFL iBT simulator
        run: npm --workspace apps/toefl-ibt-simulator run build

      - name: Build iTEP simulator
        run: npm --workspace apps/itep-simulator run build

      - name: Build academy
        run: npm --workspace apps/academy run build

      - name: Academy product smoke
        run: npm run smoke:academy

      - name: Build academy docs
        run: npm --workspace apps/academy-docs run build

      - name: Build english hub
        run: npm --workspace apps/english-hub run build
