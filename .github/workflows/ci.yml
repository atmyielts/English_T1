name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Edge modules use explicit URL/npm imports. Keep Deno from resolving the
  # unrelated frontend workspace ranges outside npm ci's reviewed lockfile.
  # Deno's default minimum dependency age policy remains enabled.
  DENO_NO_PACKAGE_JSON: '1'
  VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
  VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
  VITE_READING_PRODUCT_ID: ${{ secrets.VITE_READING_PRODUCT_ID }}
  VITE_ALLOWED_RETURN_HOSTS: schood.online,academy.schood.online,docs.academy.schood.online,english.schood.online,ielts.schood.online,practice.ielts.schood.online,playbook.ielts.schood.online,sat.schood.online,practice.sat.schood.online,playbook.sat.schood.online,toefl.schood.online,playbook.toefl.schood.online,itep.schood.online,reading.english.schood.online,writing.english.schood.online,listening.english.schood.online,speaking.english.schood.online,grammar.english.schood.online,vocabulary.english.schood.online,immersion.english.schood.online,assessment.schood.online,exam.schood.online,proctor.schood.online
  VITE_ADMIN_URL: https://schood.online/admin
  VITE_IELTS_URL: https://ielts.schood.online
  VITE_ACADEMY_URL: https://academy.schood.online
  VITE_PLATFORM_URL: https://schood.online
  VITE_AUTH_COOKIE_DOMAIN: .schood.online
  VITE_AUTH_SHARED_COOKIE: "true"
  VITE_DISABLE_PAYWALL: "false"
  VITE_USE_MOCK_PERSISTENCE: "false"
  VITE_DEBUG_AUTH: "false"
  VITE_RELEASE_SHA: ${{ github.sha }}

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install dependencies
        run: npm ci

      - name: CI merge gate contracts
        run: node --test scripts/ci-workflow.test.mjs

      - name: Production readiness checks
        run: npm run verify:prod

      - name: Production secret scanner regression contracts
        run: node --test scripts/production-secret-rules.test.mjs

      - name: Release manifest drift check
        run: npm run verify:release -- --base origin/${{ github.base_ref || 'main' }}

      - name: Academy product readiness checks
        run: npm run verify:academy

      - name: Academy lint
        run: npm --workspace apps/academy run lint

      # This CI-only change can land before the independently reviewed feature.
      # Once the guide exists, its contracts are required and run without a skip override.
      - name: Adaptive onboarding contracts and Edge typecheck
        if: hashFiles('supabase/functions/guide/handler.test.ts') != ''
        run: npm run test:guide && npm run check:guide

      - name: English Edge typecheck
        run: deno check supabase/functions/hub/index.ts

      - name: IELTS Practice Edge, access and catalog tests
        run: deno test --no-lock --allow-env supabase/functions/_shared/ielts-practice-core.test.ts supabase/functions/_shared/ielts-practice-blueprints.test.ts supabase/functions/_shared/ielts-practice-mock.test.ts supabase/functions/_shared/ielts-practice-item-srs.test.ts supabase/functions/_shared/ielts-practice-access.test.ts supabase/functions/_shared/ielts-practice-speaking.test.ts apps/ielts-practice/tests/i18n-catalog.test.ts && deno check --no-lock supabase/functions/ielts-practice/index.ts supabase/functions/ielts-srs/index.ts

      - name: English mass-readiness contracts
        run: npm run --if-present test:english:mass-readiness

      - name: Academy Edge typecheck
        run: deno check supabase/functions/academy/index.ts

      - name: Academy Edge contract tests
        run: npm run test:academy:edge

      - name: Homework OS and Courses Edge typecheck and tests
        run: deno check supabase/functions/academy-learning/index.ts && npm run test:academy-learning:edge

      - name: Audit runtime dependencies
        # Fail closed on high/critical findings. The wrapper permits only the
        # owner-approved, RSC-only exception documented in the repository.
        run: node scripts/audit-runtime-dependencies.mjs

  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - group: payments
            suites: test:payments
          - group: account-security
            suites: test:parent-report:security test:account:retention test:candidate:security test:admin:security
          - group: platform-workflows
            suites: test:platform:return test:marketplace test:peer-review:privacy test:score-cache:privacy test:pages:security test:exam-access test:pricing:browser
          - group: learning-integrations
            suites: test:exam test:sat test:shared test:telegram test:sat:completion test:sat:bank test:sat:start test:ai:security test:sat:tutor test:sat-playbook test:ielts-playbook test:sat:engine test:sat:routes test:edge-region test:toefl
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Install dependencies
        run: npm ci
      - name: Install contract browsers
        if: matrix.group != 'payments'
        run: npx playwright install --with-deps chromium
      - name: Run complete contract group
        env:
          TEST_SUITES: ${{ matrix.suites }}
        run: |
          for suite in $TEST_SUITES; do
            npm run "$suite" || exit 1
          done

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        group: [academy, guide]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install route browser
        run: npx playwright install --with-deps chromium
      - name: Academy mocked route smoke
        if: matrix.group == 'academy'
        run: npm run test:academy:routes
      - name: Adaptive onboarding browser and accessibility contracts
        if: matrix.group == 'guide' && hashFiles('apps/platform/tests/guide.spec.ts') != ''
        run: npm run test:guide:browser

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - group: platform-academy
            workspaces: apps/platform apps/academy apps/academy-docs apps/english-hub
          - group: simulators
            workspaces: apps/ielts-simulator apps/sat-simulator apps/toefl-ibt-simulator apps/itep-simulator
          - group: practice-and-playbooks
            workspaces: apps/ielts-practice apps/ielts-playbook apps/sat-practice apps/sat-playbook apps/toefl-playbook
          - group: assessment-services
            workspaces: apps/assessment-cloud apps/exam apps/proctor apps/admission
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build frontend group
        env:
          BUILD_WORKSPACES: ${{ matrix.workspaces }}
        run: |
          for workspace in $BUILD_WORKSPACES; do
            npm --workspace "$workspace" run build || exit 1
          done
      - name: Academy product smoke
        if: matrix.group == 'platform-academy'
        run: npm run smoke:academy
      - name: IELTS Practice mocked route tests (phone widths, en/uz/ru)
        if: matrix.group == 'practice-and-playbooks'
        run: npx playwright install --with-deps chromium && npm --workspace apps/ielts-practice run test:routes

  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [checks, tests, browser, build]
    if: ${{ always() }}
    steps:
      - name: Require every test and frontend build
        env:
          CHECKS_RESULT: ${{ needs.checks.result }}
          TESTS_RESULT: ${{ needs.tests.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
          BUILDS_RESULT: ${{ needs.build.result }}
        run: |
          [ "$CHECKS_RESULT" = "success" ] && [ "$TESTS_RESULT" = "success" ] && [ "$BROWSER_RESULT" = "success" ] && [ "$BUILDS_RESULT" = "success" ]
