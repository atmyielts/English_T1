name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Build steps below need the same Vite env that deploy-pages.yml provides.
    # Without these the platform / simulator / english-* apps' vite.config.ts
    # guards refuse to build and the validate job goes red on a clean checkout.
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      VITE_READING_PRODUCT_ID: ${{ secrets.VITE_READING_PRODUCT_ID }}
      VITE_ALLOWED_RETURN_HOSTS: schood.online,academy.schood.online,english.schood.online,ielts.schood.online,practice.ielts.schood.online,playbook.ielts.schood.online,sat.schood.online,practice.sat.schood.online,playbook.sat.schood.online,toefl.schood.online,playbook.toefl.schood.online,itep.schood.online,reading.english.schood.online,writing.english.schood.online,listening.english.schood.online,speaking.english.schood.online,grammar.english.schood.online,vocabulary.english.schood.online,immersion.english.schood.online
      VITE_ADMIN_URL: https://schood.online/admin
      VITE_IELTS_URL: https://ielts.schood.online
      VITE_ACADEMY_URL: https://academy.schood.online
      VITE_PLATFORM_URL: https://schood.online
      VITE_AUTH_COOKIE_DOMAIN: .schood.online
      VITE_AUTH_SHARED_COOKIE: "true"
      VITE_DISABLE_PAYWALL: "false"
      VITE_USE_MOCK_PERSISTENCE: "false"
      VITE_DEBUG_AUTH: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install dependencies
        run: npm ci

      - name: Production readiness checks
        run: npm run verify:prod

      - name: Run unit tests
        run: npm test

      - name: Audit runtime dependencies
        # Only fail on high/critical. Moderate-and-below noise (e.g. transitive
        # ws used by @supabase/realtime-js, not exposed to user input) doesn't
        # warrant blocking every PR.
        run: npm audit --omit=dev --audit-level=high

      - name: Build platform
        run: npm --workspace apps/platform run build

      - name: Build IELTS simulator
        run: npm --workspace apps/ielts-simulator run build

      - name: Build SAT simulator
        run: npm --workspace apps/sat-simulator run build

      - name: Build TOEFL iBT simulator
        run: npm --workspace apps/toefl-ibt-simulator run build

      - name: Build iTEP simulator
        run: npm --workspace apps/itep-simulator run build

      - name: Build academy
        run: npm --workspace apps/academy run build

      - name: Build english hub
        run: npm --workspace apps/english-hub run build
