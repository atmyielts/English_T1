name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Production readiness checks
        run: npm run verify:prod

      - name: Audit runtime dependencies
        run: npm audit --omit=dev

      - name: Build platform
        run: npm --workspace apps/platform run build

      - name: Build IELTS simulator
        run: npm --workspace apps/ielts-simulator run build

      - name: Build SAT simulator
        run: npm --workspace apps/sat-simulator run build

      - name: Build TOEFL iBT simulator
        run: npm --workspace apps/toefl-ibt-simulator run build

      - name: Build academy
        run: npm --workspace apps/academy run build

      - name: Build english reading
        run: npm --workspace apps/english-reading run build
