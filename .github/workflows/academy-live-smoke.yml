name: Academy Live Smoke

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Deploy Pages"]
    types: [completed]
    branches: [main]

jobs:
  live-smoke:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_run' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    env:
      ACADEMY_APP_URL: ${{ secrets.ACADEMY_APP_URL || 'https://academy.schood.online' }}
      ACADEMY_EDGE_URL: ${{ secrets.ACADEMY_EDGE_URL }}
      ACADEMY_SMOKE_TOKEN: ${{ secrets.ACADEMY_SMOKE_TOKEN }}
      ACADEMY_STUDENT_SMOKE_TOKEN: ${{ secrets.ACADEMY_STUDENT_SMOKE_TOKEN }}
      ACADEMY_SMOKE_EMAIL: ${{ secrets.ACADEMY_SMOKE_EMAIL }}
      ACADEMY_SMOKE_PASSWORD: ${{ secrets.ACADEMY_SMOKE_PASSWORD }}
      ACADEMY_STUDENT_SMOKE_EMAIL: ${{ secrets.ACADEMY_STUDENT_SMOKE_EMAIL }}
      ACADEMY_STUDENT_SMOKE_PASSWORD: ${{ secrets.ACADEMY_STUDENT_SMOKE_PASSWORD }}
      ACADEMY_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      ACADEMY_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      ACADEMY_SMOKE_ACADEMY_ID: ${{ secrets.ACADEMY_SMOKE_ACADEMY_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Download triggering deployment plan
        if: ${{ github.event_name == 'workflow_run' }}
        uses: actions/download-artifact@v4
        with:
          name: pages-deployment-plan
          path: ${{ runner.temp }}/pages-plan
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Verify Academy deploy job succeeded
        id: deploygate
        if: ${{ github.event_name == 'workflow_run' }}
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_RUN_ID: ${{ github.event.workflow_run.id }}
          DEPLOY_HEAD: ${{ github.event.workflow_run.head_sha }}
          GH_REPO: ${{ github.repository }}
          PAGES_PLAN_FILE: ${{ runner.temp }}/pages-plan/pages-deployment-plan.json
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync,appendFileSync} from 'node:fs';
          import {academySmokeDeploymentDecision} from './scripts/academy-smoke-deployment-gate.mjs';
          const repo=process.env.GH_REPO,runId=process.env.DEPLOY_RUN_ID;
          const headers={Authorization:`Bearer ${process.env.GH_TOKEN}`,Accept:'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'};
          const api=async path=>{const response=await fetch(`https://api.github.com${path}`,{headers});if(!response.ok)throw Error(`GitHub deployment metadata failed (${response.status})`);return response.json();};
          const run=await api(`/repos/${repo}/actions/runs/${runId}`);
          if(run.head_sha!==process.env.DEPLOY_HEAD)throw Error('Triggering commit changed');
          const jobs=[];let complete=false;
          for(let page=1;page<=10;page++){const result=await api(`/repos/${repo}/actions/runs/${runId}/jobs?per_page=100&page=${page}`);jobs.push(...result.jobs);if(result.jobs.length<100){complete=true;break;}}
          if(!complete)throw Error('Deployment job listing is incomplete');
          const decision=academySmokeDeploymentDecision(JSON.parse(readFileSync(process.env.PAGES_PLAN_FILE,'utf8')),run,jobs);
          appendFileSync(process.env.GITHUB_OUTPUT,`run=${decision.runSmoke}\n`);
          console.log(decision.reason); // Real schood-academy publication or an explicitly skipped plan.
          NODE

      - name: Validate live smoke secrets
        if: ${{ github.event_name == 'workflow_dispatch' || steps.deploygate.outputs.run == 'true' }}
        run: |
          missing=0
          if [ -z "$ACADEMY_EDGE_URL" ]; then
            echo "Missing required Academy live smoke secret: ACADEMY_EDGE_URL"
            missing=1
          fi
          if [ -z "$ACADEMY_SMOKE_TOKEN" ] && { [ -z "$ACADEMY_SMOKE_EMAIL" ] || [ -z "$ACADEMY_SMOKE_PASSWORD" ]; }; then
            echo "Missing owner smoke auth: set ACADEMY_SMOKE_TOKEN or ACADEMY_SMOKE_EMAIL + ACADEMY_SMOKE_PASSWORD"
            missing=1
          fi
          if [ -z "$ACADEMY_STUDENT_SMOKE_TOKEN" ] && { [ -z "$ACADEMY_STUDENT_SMOKE_EMAIL" ] || [ -z "$ACADEMY_STUDENT_SMOKE_PASSWORD" ]; }; then
            echo "Missing student smoke auth: set ACADEMY_STUDENT_SMOKE_TOKEN or ACADEMY_STUDENT_SMOKE_EMAIL + ACADEMY_STUDENT_SMOKE_PASSWORD"
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Setup Node
        if: ${{ github.event_name == 'workflow_dispatch' || steps.deploygate.outputs.run == 'true' }}
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: ${{ github.event_name == 'workflow_dispatch' || steps.deploygate.outputs.run == 'true' }}
        run: npm ci

      - name: Build Academy before smoke
        if: ${{ github.event_name == 'workflow_dispatch' || steps.deploygate.outputs.run == 'true' }}
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_ALLOWED_RETURN_HOSTS: schood.online,academy.schood.online,english.schood.online,ielts.schood.online,practice.ielts.schood.online,playbook.ielts.schood.online,sat.schood.online,practice.sat.schood.online,playbook.sat.schood.online,toefl.schood.online,playbook.toefl.schood.online,itep.schood.online,reading.english.schood.online,writing.english.schood.online,listening.english.schood.online,speaking.english.schood.online,grammar.english.schood.online,vocabulary.english.schood.online,immersion.english.schood.online,assessment.schood.online,exam.schood.online
          VITE_ADMIN_URL: https://schood.online/admin
          VITE_IELTS_URL: https://ielts.schood.online
          VITE_ACADEMY_URL: https://academy.schood.online
          VITE_PLATFORM_URL: https://schood.online
          VITE_AUTH_COOKIE_DOMAIN: .schood.online
          VITE_AUTH_SHARED_COOKIE: "true"
          VITE_READING_PRODUCT_ID: ${{ secrets.VITE_READING_PRODUCT_ID }}
          VITE_DISABLE_PAYWALL: "false"
          VITE_USE_MOCK_PERSISTENCE: "false"
          VITE_DEBUG_AUTH: "false"
        run: npm --workspace apps/academy run build

      - name: Run Academy live smoke
        if: ${{ github.event_name == 'workflow_dispatch' || steps.deploygate.outputs.run == 'true' }}
        run: npm run smoke:academy:live
