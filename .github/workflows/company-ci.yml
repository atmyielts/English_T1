name: Company English CI
on:
  pull_request:
    paths:
      - 'apps/company/**'
      - 'packages/company-core/**'
      - 'supabase/functions/company/**'
      - 'supabase/functions/_shared/english-ai.ts'
      - 'supabase/migrations/*company*'
      - 'supabase/tests/company*'
      - 'scripts/test-company-db.mjs'
      - '.github/workflows/company-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: company-${{ github.ref }}
  cancel-in-progress: true
jobs:
  service:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Shared catalogue and API routes (roles, quotas, tests, scoring, training, insights)
        run: deno test --no-lock packages/company-core/src/ supabase/functions/company/
      - name: Function type check
        run: deno check --no-lock supabase/functions/company/index.ts
  database:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Company migrations on an isolated database (English access, quotas, lockdown)
        run: node scripts/test-company-db.mjs
  app:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Service boundaries
        run: node scripts/verify-assessment-boundaries.mjs
      - name: App build
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: public-anon-placeholder
        run: npm --workspace apps/company run build
