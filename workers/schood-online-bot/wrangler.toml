name = "schood-online-bot"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

routes = [
  { pattern = "onlinebot.schood.online", custom_domain = true },
]

[vars]
SITE_URL = "https://schood.online"
DISCOVER_APP_URL = "https://schood.online/telegram/discover"
STUDENT_BOT_URL = "https://t.me/schoodstudentbot?startapp"
TELEGRAM_BOT_NAME = "schoodonlinebot"

# Secrets (set via `wrangler secret put`):
# TELEGRAM_PUBLIC_BOT_TOKEN
# WEBHOOK_SECRET
# WEBHOOK_SECRET_PREVIOUS (optional rotation overlap; remove after Telegram confirms the new secret)
# SUPABASE_URL
# TELEGRAM_INTERNAL_SECRET (must match the Edge Function secret)
