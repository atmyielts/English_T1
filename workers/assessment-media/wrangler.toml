name = "schood-assessment-media-dev"
main = "src/index.ts"
compatibility_date = "2026-07-30"
workers_dev = false
[vars]
ARTIFACT_ACTIVE_KEY_ID = "dev-k1"
[[r2_buckets]]
binding = "ARTIFACTS"
bucket_name = "schood-assessment-artifacts-dev"
[env.staging]
name = "schood-assessment-media-staging"
workers_dev = false
[env.staging.vars]
ARTIFACT_ACTIVE_KEY_ID = "staging-k1"
[[env.staging.r2_buckets]]
binding = "ARTIFACTS"
bucket_name = "schood-assessment-artifacts-staging"
[env.production]
name = "schood-assessment-media"
workers_dev = false
[env.production.vars]
ARTIFACT_ACTIVE_KEY_ID = "production-k1"
[[env.production.r2_buckets]]
binding = "ARTIFACTS"
bucket_name = "schood-assessment-artifacts"
# Configure exact ALLOWED_ORIGINS, SUPABASE_URL and server-only
# ASSESSMENT_MEDIA_SECRET / ARTIFACT_KEYRING separately in each environment.
# No bucket/domain/route or encryption secret is created by this file.
