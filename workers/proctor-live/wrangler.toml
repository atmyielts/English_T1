name = "schood-proctor-live-dev"
main = "src/index.ts"
compatibility_date = "2026-10-20"
workers_dev = false
[vars]
PROCTOR_LIVE_ENABLED = "false"
[[durable_objects.bindings]]
name = "CONNECTIONS"
class_name = "LiveConnectionBroker"
[[migrations]]
tag = "proctor-live-v1"
new_sqlite_classes = ["LiveConnectionBroker"]
[env.staging]
name = "schood-proctor-live-staging"
workers_dev = false
[env.staging.vars]
PROCTOR_LIVE_ENABLED = "false"
[[env.staging.durable_objects.bindings]]
name = "CONNECTIONS"
class_name = "LiveConnectionBroker"
[env.production]
name = "schood-proctor-live"
workers_dev = false
[env.production.vars]
PROCTOR_LIVE_ENABLED = "false"
[[env.production.durable_objects.bindings]]
name = "CONNECTIONS"
class_name = "LiveConnectionBroker"
