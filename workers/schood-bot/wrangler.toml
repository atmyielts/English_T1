name = "schood-bot"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# Serve the bot from the Schood domain instead of the default *.workers.dev.
routes = [
  { pattern = "bot.schood.online", custom_domain = true },
]

[vars]
SITE_URL = "https://schood.online"
TELEGRAM_BOT_NAME = "schoodstudentbot"

# Secrets (set via `wrangler secret put`):
# TELEGRAM_BOT_TOKEN
# SUPABASE_URL
# SUPABASE_SERVICE_KEY    (service role key — Worker is server-side only)
# WEBHOOK_SECRET          (any random string — verify Telegram is the caller)
