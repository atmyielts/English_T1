name = "schood-bot"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# Serve the bot from the Schood domain instead of the default *.workers.dev.
routes = [
  { pattern = "bot.schood.online", custom_domain = true },
]

# Schood AI daily and weekly parent briefs that are due (src/schood-ai.ts).
[triggers]
crons = ["*/15 * * * *"]

[vars]
SITE_URL = "https://schood.online"
TELEGRAM_BOT_NAME = "schoodstudentbot"

# Secrets (set via `wrangler secret put`):
# TELEGRAM_BOT_TOKEN (this Worker's existing student-bot token binding)
# SUPABASE_URL
# SUPABASE_SERVICE_KEY    (service role key — Worker is server-side only)
# TELEGRAM_INTERNAL_SECRET (must match the Edge Function secret)
# WEBHOOK_SECRET          (any random string — verify Telegram is the caller)
# SCHOOD_AI_SERVICE_SECRET (optional; must match the schood-ai Edge Function secret; Schood AI commands are off without it)
# WEBHOOK_SECRET_PREVIOUS (optional rotation overlap; remove after Telegram confirms the new secret)
