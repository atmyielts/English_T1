name = "schood-assessment-coordinator-dev"
main = "src/index.ts"
compatibility_date = "2026-10-13"
workers_dev = false

[[durable_objects.bindings]]
name = "ATTEMPTS"
class_name = "AttemptCoordinator"

[[migrations]]
tag = "assessment-runtime-001"
new_sqlite_classes = ["AttemptCoordinator"]

[triggers]
crons = ["* * * * *"]
[[queues.producers]]
binding = "RECOVERY_QUEUE"
queue = "schood-assessment-recovery-dev"
[[queues.consumers]]
queue = "schood-assessment-recovery-dev"
max_batch_size = 25
max_batch_timeout = 1
max_retries = 5
max_concurrency = 8
dead_letter_queue = "schood-assessment-recovery-dlq-dev"

[vars]
ALLOWED_ORIGINS = "http://127.0.0.1:5180"
RECOVERY_BATCH_LIMIT = "200"
# SUPABASE_URL, SUPABASE_ANON_KEY, ASSESSMENT_COORDINATOR_SECRET are separate server secrets.
# No existing Platform, Academy, Pages or Supabase production deployment is modified.

[env.staging]
name = "schood-assessment-coordinator-staging"
workers_dev = false
[[env.staging.durable_objects.bindings]]
name = "ATTEMPTS"
class_name = "AttemptCoordinator"
[env.staging.vars]
ALLOWED_ORIGINS = ""
RECOVERY_BATCH_LIMIT = "200"
[env.staging.triggers]
crons = ["* * * * *"]
[[env.staging.queues.producers]]
binding = "RECOVERY_QUEUE"
queue = "schood-assessment-recovery-staging"
[[env.staging.queues.consumers]]
queue = "schood-assessment-recovery-staging"
max_batch_size = 25
max_batch_timeout = 1
max_retries = 5
max_concurrency = 8
dead_letter_queue = "schood-assessment-recovery-dlq-staging"

[env.production]
name = "schood-assessment-coordinator"
workers_dev = false
[[env.production.durable_objects.bindings]]
name = "ATTEMPTS"
class_name = "AttemptCoordinator"
[env.production.vars]
ALLOWED_ORIGINS = ""
RECOVERY_BATCH_LIMIT = "200"
[env.production.triggers]
crons = ["* * * * *"]
[[env.production.queues.producers]]
binding = "RECOVERY_QUEUE"
queue = "schood-assessment-recovery"
[[env.production.queues.consumers]]
queue = "schood-assessment-recovery"
max_batch_size = 25
max_batch_timeout = 1
max_retries = 5
max_concurrency = 8
dead_letter_queue = "schood-assessment-recovery-dlq"
