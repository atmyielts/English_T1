# Updater is a separate networked process, never the artifact-decoding sandbox.
DatabaseDirectory /signatures
DatabaseOwner scanner
DatabaseMirror database.clamav.net
DNSDatabaseInfo current.cvd.clamav.net
# Keep directly signed CVD snapshots; no locally reconstructed CLD envelope.
ScriptedUpdates no
TestDatabases yes
Bytecode yes
Foreground yes
ConnectTimeout 30
ReceiveTimeout 120
MaxAttempts 2
