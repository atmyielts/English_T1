<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/schood-logo.png" />
    <link rel="shortcut icon" href="/schood-logo.png" />
    <link rel="apple-touch-icon" href="/schood-logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Academy | Schood</title>
    <style>
      :root {
        color-scheme: light;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
        background: radial-gradient(circle at 10% 10%, #f2f8ff 0%, #eef2ff 44%, #f8fafc 100%);
        font-family: "Manrope", "Outfit", "Inter", ui-sans-serif, system-ui, sans-serif;
        color: #0f172a;
      }

      #root {
        min-height: 100vh;
        width: 100%;
      }

      .boot-screen {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
      }

      .boot-card {
        width: min(560px, 100%);
        border-radius: 22px;
        border: 1px solid rgba(15, 23, 42, 0.08);
        background: rgba(255, 255, 255, 0.84);
        box-shadow: 0 16px 40px rgba(15, 23, 42, 0.1);
        backdrop-filter: blur(8px);
        padding: 26px;
      }

      .boot-title {
        margin: 0;
        font-size: 22px;
        line-height: 1.2;
        font-weight: 760;
      }

      .boot-subtitle {
        margin: 10px 0 0;
        color: #475569;
        font-size: 14px;
      }

      .boot-progress {
        margin-top: 16px;
        height: 6px;
        border-radius: 999px;
        overflow: hidden;
        background: rgba(148, 163, 184, 0.22);
      }

      .boot-progress-bar {
        width: 40%;
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(90deg, #2563eb, #06b6d4);
        animation: sweep 1300ms ease-in-out infinite;
      }

      @keyframes sweep {
        0% {
          transform: translateX(-120%);
        }

        100% {
          transform: translateX(360%);
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot-screen">
        <div class="boot-card" role="status" aria-live="polite">
          <h1 class="boot-title">Opening Academy workspace</h1>
          <p class="boot-subtitle">Fetching classes, students, and announcements.</p>
          <div class="boot-progress" aria-hidden="true">
            <div class="boot-progress-bar"></div>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
