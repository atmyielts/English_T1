    <style>
      :root {
        color-scheme: light;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
        background: radial-gradient(circle at 14% 18%, #eff6ff 0%, #f8fafc 52%, #eef2ff 100%);
        font-family: "Manrope", "Outfit", "Inter", ui-sans-serif, system-ui, sans-serif;
        color: #0f172a;
      }

      #root {
        min-height: 100vh;
        width: 100%;
      }

      .boot-screen {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
      }

      .boot-card {
        width: min(540px, 100%);
        border-radius: 22px;
        border: 1px solid rgba(15, 23, 42, 0.08);
        background: rgba(255, 255, 255, 0.86);
        box-shadow: 0 16px 40px rgba(15, 23, 42, 0.1);
        padding: 24px;
      }

      .boot-title {
        margin: 0;
        font-size: 22px;
        line-height: 1.2;
        font-weight: 760;
      }

      .boot-subtitle {
        margin: 10px 0 0;
        color: #475569;
        font-size: 14px;
      }

      .boot-progress {
        margin-top: 16px;
        height: 6px;
        border-radius: 999px;
        overflow: hidden;
        background: rgba(148, 163, 184, 0.22);
      }

      .boot-progress-bar {
        width: 38%;
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(90deg, #1d4ed8, #22c55e);
        animation: sweep 1350ms ease-in-out infinite;
      }

      @keyframes sweep {
        0% {
          transform: translateX(-125%);
        }

        100% {
          transform: translateX(360%);
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
