<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/schood-logo.png" />
  <link rel="shortcut icon" href="/schood-logo.png" />
  <link rel="apple-touch-icon" href="/schood-logo.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="referrer" content="no-referrer" />
  <title>Schood TOEFL iBT</title>
  <style>
    :root {
      color-scheme: light;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: radial-gradient(circle at 20% 20%, #fff7ec 0%, #fef3c7 46%, #fde68a 100%);
      font-family: "Space Grotesk", "Outfit", "Inter", ui-sans-serif, system-ui, sans-serif;
      color: #0f172a;
    }

    #root {
      min-height: 100vh;
      width: 100%;
    }

    .boot-screen {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .boot-card {
      width: min(560px, 100%);
      border-radius: 22px;
      border: 1px solid rgba(15, 23, 42, 0.08);
      background: rgba(255, 255, 255, 0.78);
      backdrop-filter: blur(10px);
      box-shadow: 0 18px 44px rgba(15, 23, 42, 0.09);
      padding: 28px 26px;
    }

    .boot-top {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .boot-spinner {
      width: 22px;
      height: 22px;
      border-radius: 999px;
      border: 2px solid #fed7aa;
      border-top-color: #ea580c;
      animation: spin 850ms linear infinite;
      flex-shrink: 0;
    }

    .boot-title {
      margin: 0;
      font-size: 21px;
      line-height: 1.2;
      font-weight: 700;
      letter-spacing: 0.01em;
    }

    .boot-subtitle {
      margin: 10px 0 0;
      color: #475569;
      font-size: 14px;
      line-height: 1.5;
    }

    .boot-progress {
      margin-top: 18px;
      height: 6px;
      border-radius: 999px;
      overflow: hidden;
      background: rgba(251, 146, 60, 0.18);
    }

    .boot-progress-bar {
      width: 40%;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, #ea580c, #f59e0b);
      animation: sweep 1300ms ease-in-out infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    @keyframes sweep {
      0% {
        transform: translateX(-120%);
      }

      100% {
        transform: translateX(360%);
      }
    }
  </style>
</head>

<body>
  <div id="root">
    <div class="boot-screen">
      <div class="boot-card" role="status" aria-live="polite">
        <div class="boot-top">
          <span class="boot-spinner" aria-hidden="true"></span>
          <h1 class="boot-title">Preparing TOEFL iBT Simulator</h1>
        </div>
        <p class="boot-subtitle">Loading workspace, auth session, and latest test configuration.</p>
        <div class="boot-progress" aria-hidden="true">
          <div class="boot-progress-bar"></div>
        </div>
      </div>
    </div>
  </div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
