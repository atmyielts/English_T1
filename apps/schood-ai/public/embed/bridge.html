<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<title>Schood AI widget bridge</title>
</head>
<body>
<script>
/* The hidden page a centre's website widget (widget.js) talks through. It runs on
 * Schood's own site, so the Schood AI function accepts its calls (core's anonymous
 * routes), and it tells the function which website asked: the origin the browser
 * reports for the message (postMessage), which the embedding page cannot fake. The
 * function answers only websites the centre allowed. Nothing here is shown, stored or
 * read from the embedding page except the message itself. */
(function () {
  'use strict';
  var api = (new URLSearchParams(location.search).get('api') || '').replace(/\/+$/, '');
  // Only a Schood AI function: a Supabase project's, Schood's own domain, or a local dev stack.
  var allowed = /^https:\/\/[a-z0-9-]+\.supabase\.co\/functions\/v1\/schood-ai$/.test(api) ||
    /^https:\/\/([a-z0-9-]+\.)*schood\.online(\/[a-z0-9-]+)*\/schood-ai$/.test(api) ||
    /^http:\/\/(localhost|127\.0\.0\.1)(:\d+)?\/functions\/v1\/schood-ai$/.test(api);
  if (!allowed || window.parent === window) return;
  var OPS = { config: 'GET', chat: 'POST', poll: 'POST', placement: 'POST' };
  window.addEventListener('message', function (event) {
    if (event.source !== window.parent) return;
    var data = event.data;
    if (!data || data.schood !== 'embed' || typeof data.id !== 'number' || !Object.prototype.hasOwnProperty.call(OPS, data.op)) return;
    var site = event.origin;
    var reply = function (ok, status, body) { event.source.postMessage({ schood: 'embed', id: data.id, ok: ok, status: status, data: body }, site); };
    var key = String(data.key || ''), lang = String(data.lang || 'uz');
    var url = api + '/centre/embed-' + data.op, init;
    if (OPS[data.op] === 'GET') {
      url += '?key=' + encodeURIComponent(key) + '&site=' + encodeURIComponent(site) + '&lang=' + encodeURIComponent(lang);
      init = { method: 'GET' };
    } else {
      var body = Object.assign({}, data.body && typeof data.body === 'object' ? data.body : {}, { key: key, site: site, lang: lang });
      init = { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) };
    }
    fetch(url, init).then(function (response) {
      return response.json().catch(function () { return {}; }).then(function (json) { reply(response.ok, response.status, json); });
    }).catch(function () { reply(false, 0, { code: 'network' }); });
  });
  window.parent.postMessage({ schood: 'embed', ready: true }, '*');
})();
</script>
</body>
</html>
